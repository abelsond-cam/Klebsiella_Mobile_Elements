# MGEfinder pipeline config (single source of truth for paths and MGEfinder parameters).
# data_dir = root for raw data, metadata, reference_comparison_sets (assemblies, fastq, etc.)
# wd = pipeline working dir; outputs (00.genome, 00.assembly, bam, mgefinder, database, results) go under wd
# genomes = set at runtime by run_pipeline.py (from reference_comparison_sets.tsv) and merged into one config for Snakemake
data_dir: /home/dca36/rds/rds-floto-bacterial-4k08a2yyQLw/david
wd: /home/dca36/rds/rds-floto-bacterial-4k08a2yyQLw/david/processed/mgefinder

# Data paths (relative to data_dir)
assemblies_dir: raw/assemblies   # legacy fallback only; assemblies now resolved from metadata assembly_file
fastq_dir: raw/fastq
metadata_file: final/metadata_final_curated_slimmed.tsv
reference_comparison_sets: processed/mgefinder/reference_comparison_sets.tsv  # legacy/temporary; superseded by metadata-driven selection below
n_set_to_run: 1  # legacy (reference_comparison_sets row mode): 1 = first row only, -1 = all rows

# Metadata-driven sample selection (the proper replacement for reference_comparison_sets.tsv).
# assembly_file / gff_file columns in the metadata are relative to metadata_path_base
# (the RDS project root = parent of data_dir).
metadata_path_base: /home/dca36/rds/rds-floto-bacterial-4k08a2yyQLw
sublineage: SL39                                            # metadata Sublineage column value to select
reference_sample_name: GCF_000814305.1_ASM81430v1_genomic   # external reference (same as trial); must be a metadata row
validate_n: 1   # limit selected samples for small validation runs; -1 = all samples in the sublineage

# Whole-SL streaming: when true, each sample's reads are downloaded on demand by
# the Snakemake download_fastq rule and temp()-deleted right after bwa, so peak
# FASTQ disk ~= one sample (run with -j 1 for strict serial download/align/delete).
# Leave false for the small validation runs (uses pre-downloaded FASTQ on disk).
stream_fastq: false

# Dataset table produced by generate_mgefinder_dataset.py (path relative to wd; written to wd/)
mgefinder_dataset: mgefinder_dataset.txt

# Pipeline output dirs (created by Snakemake; relative to wd)
genome_dir: "00.genome"
assembly_dir: "00.assembly"
bam_dir: "00.bam"
mgefinder_dir: mgefinder
database_dir: database
results_dir: results

# Injected per run by driver when using reference_comparison_sets.tsv (not set here):
# reference_sample_name: from TSV row
# genomes: [reference_sample_name]

memory: 16000

# MGEfinder parameters (from denovo.original.config.yml)
# MGEfinder config parameters (find, pair, inferseq_, etc.) 
# All those entries match the MGEfinder denovo.original.config.yml from the GitHub repo. 
# Values (e.g. minlen: 8, mincount: 2, minq: 20) are the same as in that file.
find:
  minlen: 8
  mincount: 2
  minq: 20
  minial: 21
  mindist: 22
  minratio: 0.10
  maxir: 0.03
  lins: 30
  mcc: 2
  check_bwa_flag: "--check-bwa"

pair:
  maxdr: 20
  minq: 20
  minial: 21
  maxjsp: 0.15
  lins: 30

inferseq_assembly:
  minident: 0.95
  maxclip: 0.05
  maxsize: 200000
  minsize: 30

inferseq_reference:
  minident: 0.95
  maxclip: 0.05
  maxsize: 200000
  minsize: 30

inferseq_overlap:
  minscore: 10
  minopi: 0.9
  minsize: 30

makedatabase:
  minsize: 30
  maxsize: 200000

inferseq_database:
  minident: 0.90
  maxclip: 0.05
  maxedgedist: 10

clusterseq:
  minsize: 70
  maxsize: 200000

genotype:
  filter_clusters: True
